<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Progress</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src * data: blob: filesystem: about: ws: wss: 'unsafe-inline' 'unsafe-eval'; img-src * data: blob:;"
    />
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
      @font-face {
        font-family: "coc-font";
        src: url("https://link.clashofclans.com/_next/static/media/c02f06199c732d49-s.p.woff2")
          format("woff2");
      }

      :root {
        --bg: #0f172a;
        --panel: rgba(15, 23, 42, 0.84);
        --panel-strong: rgba(15, 23, 42, 0.96);
        --line: rgba(148, 163, 184, 0.2);
        --text: #e5eef8;
        --muted: #9fb0c9;
        --gold: #f5c451;
        --green: #34d399;
        --blue: #60a5fa;
        --red: #f87171;
        --shadow: 0 20px 45px rgba(2, 6, 23, 0.42);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Trebuchet MS", "Segoe UI", "coc-font", sans-serif;
        color: var(--text);
        --background-image: none;
        background:
          linear-gradient(
            180deg,
            rgba(15, 23, 42, 0.62),
            rgba(15, 23, 42, 0.92)
          ),
          var(--background-image) center/cover fixed no-repeat,
          var(--bg);
      }

      .page {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 20px 40px;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
        gap: 20px;
        align-items: stretch;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(8px);
      }

      .profile {
        padding: 26px;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 18px;
        align-items: center;
      }

      .profile-visuals {
        display: grid;
        grid-template-columns: repeat(2, 108px);
        grid-template-rows: repeat(2, 108px);
        align-items: center;
        justify-items: center;
        gap: 14px;
      }

      .profile-badge {
        width: 108px;
        height: 108px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 12px;
        object-fit: contain;
      }

      .profile-badge--townhall {
        background:
          radial-gradient(
            circle at 30% 25%,
            rgba(255, 255, 255, 0.22),
            transparent 40%
          ),
          rgba(255, 255, 255, 0.08);
      }

      .profile-badge--builderhall {
        background:
          radial-gradient(
            circle at 30% 25%,
            rgba(255, 255, 255, 0.18),
            transparent 40%
          ),
          rgba(255, 255, 255, 0.08);
      }

      .profile-badge--league {
        background:
          radial-gradient(
            circle at 30% 25%,
            rgba(255, 255, 255, 0.24),
            transparent 40%
          ),
          rgba(255, 255, 255, 0.08);
      }

      .profile-badge--placeholder {
        background: rgba(255, 255, 255, 0.02);
        border-style: dashed;
        opacity: 0.35;
      }

      .profile-badge-fallback {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        text-align: center;
        font-size: 22px;
        font-weight: 800;
        line-height: 1.05;
        color: var(--text);
      }

      .eyebrow {
        color: var(--gold);
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 5vw, 52px);
        line-height: 0.95;
      }

      .subtitle {
        margin-top: 10px;
        color: var(--muted);
        font-size: 16px;
      }

      .tagline {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .chip {
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.06);
        font-size: 13px;
        color: var(--text);
      }

      .summary {
        padding: 22px;
        display: grid;
        gap: 14px;
        background:
          linear-gradient(
            135deg,
            rgba(96, 165, 250, 0.2),
            rgba(52, 211, 153, 0.08)
          ),
          var(--panel-strong);
      }

      .summary h2,
      .section h2 {
        margin: 0 0 4px;
        font-size: 20px;
      }

      .summary-grid,
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .mini-stat,
      .stat {
        padding: 14px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        min-width: 0;
      }

      .mini-stat-label,
      .stat-label {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .mini-stat-label img,
      .stat-label img {
        width: 18px;
        height: 18px;
        object-fit: contain;
      }

      .avatar-fallback {
        width: 44px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: linear-gradient(
          135deg,
          rgba(96, 165, 250, 0.35),
          rgba(52, 211, 153, 0.28)
        );
        color: var(--text);
        font-weight: 800;
        font-size: 18px;
        flex: 0 0 auto;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .mini-stat-value,
      .stat-value {
        font-size: 24px;
        margin-top: 8px;
        font-weight: 700;
      }

      .stats-grid {
        margin-top: 20px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .section {
        margin-top: 20px;
        padding: 22px;
      }

      .tabs-shell {
        margin-top: 20px;
        padding: 22px;
      }

      .tab-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
      }

      .tab-button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        border-radius: 999px;
        padding: 10px 14px;
        font-size: 13px;
        cursor: pointer;
        transition:
          transform 160ms ease,
          background 160ms ease,
          border-color 160ms ease;
      }

      .tab-button:hover {
        transform: translateY(-1px);
        border-color: rgba(255, 255, 255, 0.18);
      }

      .tab-button.is-active {
        background: linear-gradient(
          135deg,
          rgba(96, 165, 250, 0.26),
          rgba(52, 211, 153, 0.18)
        );
        border-color: rgba(96, 165, 250, 0.45);
      }

      .tab-panel {
        display: none;
      }

      .tab-panel.is-active {
        display: block;
      }

      .tab-panel + .tab-panel {
        margin-top: 28px;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: baseline;
        margin-bottom: 14px;
      }

      .section-header p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .progress-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .equipment-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .equipment-groups {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .troop-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .troop-group {
        width: 100%;
      }

      .equipment-group + .equipment-group {
        margin-top: 0;
      }

      .equipment-group-title {
        margin-bottom: 12px;
        padding: 10px 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.055);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--gold);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .progress-item {
        padding: 0;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid rgba(255, 255, 255, 0.08);
        display: grid;
        grid-template-columns: 108px minmax(0, 1fr);
        overflow: hidden;
        min-height: 136px;
      }

      .progress-item--th-maxed {
        border-color: rgba(34, 197, 94, 0.9);
      /*   box-shadow:
          inset 0 0 0 1px rgba(74, 222, 128, 0.22),
          0 0 0 1px rgba(22, 163, 74, 0.28),
          0 14px 28px rgba(3, 105, 39, 0.22); */
        background:
          linear-gradient(
            180deg,
            rgba(22, 163, 74, 0.12),
            rgba(255, 255, 255, 0.045)
          ),
          rgba(255, 255, 255, 0.045);
      }

      .progress-visual {
        min-height: 100%;
        background: linear-gradient(
          180deg,
          rgba(96, 165, 250, 0.14),
          rgba(52, 211, 153, 0.08)
        );
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 14px;
        border-right: 1px solid rgba(255, 255, 255, 0.08);
      }

      .progress-item--th-maxed .progress-visual {
        border-right-color: rgba(34, 197, 94, 0.35);
        background: linear-gradient(
          180deg,
          rgba(34, 197, 94, 0.18),
          rgba(52, 211, 153, 0.08)
        );
      }

      .progress-item--th-maxed .bar {
        background: rgba(20, 83, 45, 0.35);
      }

      .progress-item--th-maxed .bar > span {
        background: linear-gradient(90deg, #22c55e, #86efac);
        box-shadow: 0 0 14px rgba(74, 222, 128, 0.28);
      }

      .progress-item--th-maxed .progress-cap {
        color: #bbf7d0;
        font-weight: 600;
      }

      .progress-visual img,
      .progress-visual .avatar-fallback {
        width: 84px;
        height: 84px;
        border-radius: 18px;
      }

      .progress-visual img {
        object-fit: contain;
        background: rgba(255, 255, 255, 0.08);
        padding: 8px;
      }

      .progress-content {
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        min-width: 0;
      }

      .progress-top {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: flex-start;
      }

      .progress-name {
        min-width: 0;
      }

      .progress-name strong {
        display: block;
        font-size: 20px;
        line-height: 1.1;
      }

      .progress-name span {
        display: block;
        margin-top: 4px;
        font-size: 13px;
        color: var(--muted);
      }

      .progress-level {
        font-size: 28px;
        line-height: 1;
        font-weight: 800;
        color: var(--text);
        white-space: nowrap;
        letter-spacing: -0.03em;
      }

      .level-badge-wrap {
        flex: 0 0 auto;
        display: flex;
        align-items: flex-start;
        justify-content: flex-end;
        min-width: 58px;
      }

      .dark-level-badge {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        position: relative;
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .dark-level-badge::before {
        content: none;
      }

      .dark-level-badge::after {
        content: none;
      }

      .dark-level-badge span {
        position: relative;
        z-index: 1;
        font-size: 18px;
        line-height: 1;
        font-weight: 900;
        color: #f6f8fb;
        width: 100%;
        padding: 14px 0px 0px;
        text-align: center;
        text-shadow:
          0 1px 0 rgba(0, 0, 0, 0.65),
          0 0 3px rgba(0, 0, 0, 0.45);
      }

      .max-badge {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        position: relative;
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        overflow: visible;
      }

      .max-badge span {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        line-height: 1;
        font-weight: 900;
        color: #2b2000;
        padding: 14px 0px 0px;
        text-shadow:
          0 1px 0 rgba(255, 248, 196, 0.65),
          0 0 3px rgba(255, 210, 78, 0.35);
      }

      .max-badge::before {
        content: none;
      }

      .max-badge::after {
        content: none;
      }

      .progress-cap {
        color: var(--muted);
        font-size: 13px;
        text-align: right;
      }

      .bar {
        width: 100%;
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
      }

      .bar > span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--blue), var(--green));
        width: 0;
      }

      .achievements {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .achievement {
        padding: 14px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .achievement strong {
        display: block;
        margin-bottom: 6px;
        font-size: 15px;
      }

      .achievement p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .achievement .value {
        margin-top: 8px;
        color: var(--text);
        font-size: 13px;
      }

      .page-actions {
        margin-top: 18px;
        display: flex;
        justify-content: flex-end;
      }

      .coc-btn {
        appearance: none;
        text-decoration: none;
        display: inline-block;
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
        transition: transform 0.1s linear;
        font-family: "coc-font", sans-serif;
      }

      .coc-btn:active {
        -webkit-transform: scale(0.95);
        transform: scale(0.95);
      }

      .coc-btn.button {
        font-weight: 700;
        position: relative;
        border-radius: 12px;
        border: 1px solid #000;
        background: linear-gradient(180deg, #d3ebb7, #85c03f 40%, #366c1b);
        font-size: 22px;
        line-height: 1.2em;
        box-shadow:
          0 0 0 1px #000,
          0 0 0 2px #000,
          0 4px 0 2px rgba(0, 0, 0, 0.2);
        text-shadow:
          0 -2px #000,
          0 0 #000,
          0 2px #000,
          0 4px #000,
          -1px -1px #000,
          1px -1px #000,
          1px 0 #000,
          -1px 0 #000,
          1px 1px #000,
          -1px 1px #000,
          1px 2px #000,
          -1px 2px #000;
        color: #fff;
        cursor: pointer;
        min-width: 280px;
        padding: 18px 24px;
      }

      .coc-btn.button::before,
      .coc-btn.button::after {
        position: absolute;
        content: "";
        z-index: 0;
      }

      .coc-btn.button::before {
        inset: 2px;
        border-radius: 12px;
        background: linear-gradient(180deg, #7fc427, #58a221);
        box-shadow: inset 0 0 0.2143rem 0.0357rem hsla(0, 0%, 100%, 0.23);
      }

      .coc-btn.button::after {
        top: 0.375rem;
        right: 0.375rem;
        left: 0.375rem;
        height: 50%;
        border-radius: 0.5rem;
        background: linear-gradient(180deg, #d0e878, rgba(152, 208, 64, 0.73));
      }

      .coc-btn.button span {
        position: relative;
        z-index: 1;
        padding: 0 5px;
      }

      .footer {
        margin-top: 18px;
        color: rgba(229, 238, 248, 0.72);
        text-align: right;
        font-size: 12px;
      }

      @media (max-width: 980px) {
        .hero,
        .stats-grid,
        .progress-grid,
        .equipment-grid,
        .troop-grid,
        .achievements {
          grid-template-columns: 1fr;
        }

        .profile {
          grid-template-columns: 1fr;
          text-align: center;
        }

        .profile-visuals {
          justify-content: center;
        }

        .profile-badge {
          margin: 0;
        }

        .tagline {
          justify-content: center;
        }

        .progress-item {
          grid-template-columns: 88px minmax(0, 1fr);
          min-height: 120px;
        }

        .progress-visual img,
        .progress-visual .avatar-fallback {
          width: 68px;
          height: 68px;
        }

        .progress-top {
          flex-direction: column;
        }

        .progress-level,
        .progress-cap {
          text-align: left;
        }

        .level-badge-wrap {
          justify-content: flex-start;
        }

        .dark-level-badge,
        .max-badge {
          width: 44px;
          height: 44px;
        }

        .dark-level-badge span {
          font-size: 19px;
        }

        .max-badge span {
          font-size: 19px;
        }

        .page-actions {
          justify-content: stretch;
        }

        .coc-btn.button {
          width: 100%;
          min-width: 0;
        }
      }

      @media print {
        body {
          background: #0f172a;
        }

        .page {
          max-width: none;
          padding: 0;
        }

        .page-actions {
          display: none !important;
        }

        .card {
          box-shadow: none;
          backdrop-filter: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <article class="card profile">
          <div class="profile-visuals" id="profileVisuals"></div>
          <div>
            <div class="eyebrow">Player Progress</div>
            <h1 id="playerName"></h1>
            <div class="subtitle" id="playerSubtitle"></div>
            <div class="tagline" id="playerChips"></div>
          </div>
        </article>

        <aside class="card summary">
          <div class="section-header">
            <h2>Panoramica</h2>
            <p id="lastUpdated"></p>
          </div>
          <div class="summary-grid" id="summaryStats"></div>
        </aside>
      </section>

      <section class="stats-grid" id="topStats"></section>

      <section class="card tabs-shell">
        <div class="section-header">
          <h2>Dettaglio Progressione</h2>
          <p></p>
        </div>
        <div id="progressTabs"></div>
      </section>

      <div class="page-actions">
        <button class="coc-btn button" id="printButton" type="button">
          <span>Esporta PDF</span>
        </button>
      </div>

      <div class="footer">
        Generato automaticamente dal bot Telegram Clash of Clans
      </div>
    </main>
  <script>

      "Healing Tome": "Grand Warden",
      Fireball: "Grand Warden",
      "Lavaloon Puppet": "Grand Warden",
      "Heroic Torch": "Grand Warden",
      "Royal Gem": "Royal Champion",
      "Seeking Shield": "Royal Champion",
      "Hog Rider Puppet": "Royal Champion",
      "Haste Vial": "Royal Champion",
      "Rocket Spear": "Royal Champion",
      "Electro Boots": "Royal Champion",
      "Frost Flake": "Royal Champion",
      "Fire Heart": "Dragon Duke",
      "Flame Blower": "Dragon Duke",
      "Stun Blaster": "Dragon Duke",
      "Electro Fangs": "Dragon Duke",
      "Rocket Backpack": "Dragon Duke",
    };
    const EQUIPMENT_HERO_FOLDER_MAP = {
      "Barbarian King": "king",
      "Archer Queen": "queen",
      "Minion Prince": "minion_prince",
      "Grand Warden": "warden",
      "Royal Champion": "champion",
      "Dragon Duke": "duke",
    };
    const SUMMARY_STAT_DEFINITIONS = [
      { label: "Esperienza", iconUrl: `${OTHER_ASSET_BASE}/XP.png` },
      { label: "Donazioni", iconUrl: "" },
      { label: "Ricevute", iconUrl: "" },
      { label: "Capitale Clan", iconUrl: "" },
    ];
    const TOP_STAT_DEFINITIONS = [
      { label: "Trofei", iconUrl: `${OTHER_ASSET_BASE}/Trophy.png` },
      { label: "Record Trofei", iconUrl: `${OTHER_ASSET_BASE}/legendTrophy.png` },
      { label: "Stelle di Guerra", iconUrl: `${OTHER_ASSET_BASE}/Star.png` },
      { label: "Trofei BH", iconUrl: `${OTHER_ASSET_BASE}/builderTrophy.png` },
    ];
    const TAB_DEFINITIONS = [
      {
        code: 0,
        id: "home-heroes",
        label: "Eroi Home",
        title: "Eroi del Villaggio Principale",
        subtitle: "Livello attuale e limite disponibile al tuo Town Hall",
        itemLabel: "Villaggio Principale",
        capKind: "th",
      },
      {
        code: 1,
        id: "builder-heroes",
        label: "Eroi Builder",
        title: "Eroi della Builder Base",
        subtitle: "Livello attuale e limite disponibile al tuo Builder Hall",
        itemLabel: "Builder Base",
        capKind: "bh",
      },
      {
        code: 2,
        id: "pets",
        label: "Pet",
        title: "Pet",
        subtitle: "Progressione pet e cap disponibile al tuo Town Hall",
        itemLabel: "Pet",
        capKind: "th",
      },
      {
        code: 3,
        id: "equipment",
        label: "Equipaggiamenti",
        title: "Equipaggiamenti Eroi",
        subtitle: "Progressione equipaggiamenti e cap disponibile al tuo Town Hall",
        itemLabel: "Equipaggiamento Eroe",
        capKind: "th",
      },
      {
        code: 4,
        id: "home-troops",
        label: "Truppe Home",
        title: "Truppe del Villaggio Principale",
        subtitle: "Progressione truppe e cap disponibile al tuo Town Hall",
        itemLabel: "Villaggio Principale",
        capKind: "th",
      },
      {
        code: 5,
        id: "builder-troops",
        label: "Truppe Builder",
        title: "Truppe Builder",
        subtitle: "Progressione truppe e cap disponibile al tuo Builder Hall",
        itemLabel: "Builder Base",
        capKind: "bh",
      },
      {
        code: 6,
        id: "spells",
        label: "Pozioni",
        title: "Pozioni",
        subtitle: "Progressione pozioni e cap disponibile al tuo Town Hall",
        itemLabel: "Pozione",
        capKind: "th",
      },
      {
        code: 7,
        id: "achievements",
        label: "Achievement",
        title: "Achievement in evidenza",
        subtitle: "",
        itemLabel: "Achievement",
        isAchievement: true,
      },
    ];
    const TAB_BY_CODE = new Map(
      TAB_DEFINITIONS.map((definition) => [definition.code, definition]),
    );
    const TAB_BY_ID = new Map(
      TAB_DEFINITIONS.map((definition) => [definition.id, definition]),
    );

    function getHashParams() {
      const rawHash = window.location.hash.replace(/^#/, "");
      return new URLSearchParams(rawHash);
    }

    function getPageDataParam() {
      const queryParams = new URLSearchParams(window.location.search);
      const hashParams = getHashParams();

      return (
        hashParams.get("data") ||
        queryParams.get("data") ||
        hashParams.get("d") ||
        queryParams.get("d")
      );
    }

    function decodePageData(encoded) {
      if (!encoded) return null;

      const decoders = [
        function decodeLzString(value) {
          if (!window.LZString) return null;
          return window.LZString.decompressFromEncodedURIComponent(value);
        },
        function decodeUrlEncoded(value) {
          return decodeURIComponent(value);
        },
        function decodeBase64Url(value) {
          const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
          const padded = normalized.padEnd(
            normalized.length + ((4 - (normalized.length % 4)) % 4),
            "=",
          );
          return atob(padded);
        },
      ];

      for (const decoder of decoders) {
        try {
          const decoded = decoder(encoded);

          if (!decoded) continue;

          return JSON.parse(decoded);
        } catch {
          // Prova il decoder successivo.
        }
      }

      return null;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeAssetName(name) {
      return String(name || "").replace(/ /g, "_");
    }

    function buildAssetUrl(relativePath) {
      return `${ASSETS_BASE}/${relativePath}`;
    }

    function resolveItemImageUrl(name, tab) {
      const normalized = normalizeAssetName(name);

      if (!name || !tab) return "";

      if (tab.id === "home-heroes") {
        return buildAssetUrl(`homeArmy/heroes/Avatar_Hero_${normalized}.webp`);
      }

      if (tab.id === "builder-heroes") {
        return buildAssetUrl(`builderArmy/heroes/Avatar_Hero_${normalized}.webp`);
      }

      if (tab.id === "pets" || PET_NAMES.has(name)) {
        return buildAssetUrl(`homeArmy/pets/Avatar_${normalized}.webp`);
      }

      if (tab.id === "equipment") {
        const heroFolder = EQUIPMENT_HERO_FOLDER_MAP[EQUIPMENT_HERO_MAP[name] || ""];
        const fileName = EQUIPMENT_ASSET_MAP[name] || `${normalized}.webp`;

        if (!heroFolder) return "";

        return buildAssetUrl(`homeArmy/heroes/equipments/${heroFolder}/${fileName}`);
      }

      if (tab.id === "spells") {
        return buildAssetUrl(`homeArmy/spells/${normalized}_info.webp`);
      }

      if (tab.id === "builder-troops") {
        return buildAssetUrl(`builderArmy/troops/Avatar_${normalized}.webp`);
      }

      if (tab.id === "home-troops") {
        if (SIEGE_MACHINE_NAMES.has(name)) {
          return buildAssetUrl(`homeArmy/siege_machines/Avatar_${normalized}.webp`);
        }

        if (SUPER_TROOP_NAMES.has(name)) {
          return buildAssetUrl(`homeArmy/super_troops/Avatar_${normalized}.webp`);
        }

        return buildAssetUrl(`homeArmy/troops/Avatar_${normalized}.webp`);
      }

      return "";
    }

    function buildItemVisual(name, imageUrl) {
      const safeLetter = escapeHtml((name || "").charAt(0));

      if (!imageUrl) {
        return `<span class="avatar-fallback" aria-hidden="true">${safeLetter}</span>`;
      }

      return `
        <img
          src="${escapeHtml(imageUrl)}"
          alt="${escapeHtml(name)}"
          loading="lazy"
          onerror="this.replaceWith(Object.assign(document.createElement('span'), { className: 'avatar-fallback', textContent: '${safeLetter}' }))"
        />
      `;
    }

    function buildStats(values, definitions) {
      return definitions.map((definition, index) => [
        definition.label,
        values?.[index] ?? "0",
        definition.iconUrl || "",
      ]);
    }

    function normalizeTabs(rawTabs, version) {
      return (rawTabs || [])
        .map((tab) => {
          if (!Array.isArray(tab)) return null;

          if (version === 2) {
            const [code, items] = tab;
            const definition = TAB_BY_CODE.get(code);

            if (!definition) return null;

            return {
              ...definition,
              items: Array.isArray(items) ? items : [],
            };
          }

          const [id, label, title, subtitle, items] = tab;
          const definition = TAB_BY_ID.get(id) || {};

          return {
            ...definition,
            id: definition.id || id,
            label: label || definition.label || "",
            title: title || definition.title || "",
            subtitle: subtitle || definition.subtitle || "",
            itemLabel: definition.itemLabel || "",
            capKind: definition.capKind || "",
            isAchievement: definition.isAchievement || id === "achievements",
            items: Array.isArray(items) ? items : [],
          };
        })
        .filter(Boolean);
    }

    function normalizePageData(data) {
      if (!data || typeof data !== "object") return null;

      const version = Number(data.v) || 1;

      if (version >= 2) {
        return {
          title: data.t || (data.pn ? `Progressione ${data.pn}` : "Player Progress"),
          bg: data.bg || "",
          profile: Array.isArray(data.pf) ? data.pf : [],
          pn: data.pn || "",
          pt: data.pt || "",
          cn: data.cn || "",
          r: data.r || "",
          th: data.th ?? null,
          bh: data.bh ?? null,
          lg: data.lg || "",
          lu: data.lu || "",
          s: buildStats(data.s, SUMMARY_STAT_DEFINITIONS),
          o: buildStats(data.o, TOP_STAT_DEFINITIONS),
          tabs: normalizeTabs(data.tabs, version),
        };
      }

      return {
        title: data.t || (data.pn ? `Progressione ${data.pn}` : "Player Progress"),
        bg: data.bg || "",
        profile: Array.isArray(data.profile) ? data.profile : [],
        pn: data.pn || "",
        pt: data.pt || "",
        cn: data.cn || "",
        r: data.r || "",
        th: data.th ?? null,
        bh: data.bh ?? null,
        lg: data.lg || "",
        lu: data.lu || "",
        s: Array.isArray(data.s) ? data.s : [],
        o: Array.isArray(data.o) ? data.o : [],
        tabs: normalizeTabs(data.tabs, version),
      };
    }

    function renderBadge(url, alt, extraClass = "") {
      if (!url) {
        return `<div class="profile-badge profile-badge--placeholder ${extraClass}" aria-hidden="true">?</div>`;
      }

      return `<img class="profile-badge ${extraClass}" src="${escapeHtml(url)}" alt="${escapeHtml(alt)}" />`;
    }

    function renderProfileVisuals(profile) {
      const [clanBadgeUrl, leagueBadgeUrl, townHallLevel, builderHallLevel] =
        profile || [];
      const container = document.getElementById("profileVisuals");

      if (!container) return;

      container.innerHTML = `
        ${renderBadge(clanBadgeUrl, "Clan badge")}
        ${renderBadge(leagueBadgeUrl, "League badge", "profile-badge--league")}
        ${townHallLevel != null ? `<div class="profile-badge profile-badge--townhall"><span>${escapeHtml(String(townHallLevel))}</span></div>` : `<div class="profile-badge profile-badge--placeholder"><span>TH</span></div>`}
        ${builderHallLevel != null ? `<div class="profile-badge profile-badge--builderhall"><span>${escapeHtml(String(builderHallLevel))}</span></div>` : `<div class="profile-badge profile-badge--placeholder"><span>BH</span></div>`}
      `;
    }

    function renderChips(data) {
      const chips = [
        data.r,
        data.th ? `Town Hall ${data.th}` : "",
        data.bh ? `Builder Hall ${data.bh}` : "",
        data.lg,
      ]
        .filter(Boolean)
        .map((text) => `<span class="chip">${escapeHtml(text)}</span>`)
        .join("");

      const chipsContainer = document.getElementById("playerChips");
      if (chipsContainer) chipsContainer.innerHTML = chips;
    }

    function renderStats(containerId, stats, isSummary = false) {
      const container = document.getElementById(containerId);
      if (!container) return;

      container.innerHTML = (stats || [])
        .map(([label, value, iconUrl]) => {
          const icon = iconUrl
            ? `<img src="${escapeHtml(iconUrl)}" alt="${escapeHtml(label)}" />`
            : "";

          if (isSummary) {
            return `
              <div class="mini-stat">
                <div class="mini-stat-label">${icon}<span>${escapeHtml(label)}</span></div>
                <div class="mini-stat-value">${escapeHtml(value)}</div>
              </div>
            `;
          }

          return `
            <article class="card stat">
              <div class="stat-label">${icon}<span>${escapeHtml(label)}</span></div>
              <div class="stat-value">${escapeHtml(value)}</div>
            </article>
          `;
        })
        .join("");
    }

    function getCapLabel(tab, data) {
      if (tab.capKind === "th") {
        return `Lvl Max TH ${data.th ?? "N/D"}`;
      }

      if (tab.capKind === "bh") {
        return `Lvl Max BH ${data.bh ?? "N/D"}`;
      }

      return "";
    }

    function renderRegularProgressItem(name, subtitle, level, currentMax, capLabel, imageUrl) {
      const safeCurrentMax = Math.max(1, Number(currentMax) || 1);
      const safeLevel = Number(level) || 0;
      const pct = Math.max(
        0,
        Math.min(100, Math.round((safeLevel / safeCurrentMax) * 100)),
      );
      const isMaxed = safeLevel >= safeCurrentMax;

      return `
        <article class="progress-item${isMaxed ? " progress-item--th-maxed" : ""}">
          <div class="progress-visual">
            ${buildItemVisual(name, imageUrl)}
          </div>
          <div class="progress-content">
            <div class="progress-top">
              <div class="progress-name">
                <strong>${escapeHtml(name)}</strong>
                <span>${escapeHtml(subtitle || "")}</span>
              </div>
              <div class="level-badge-wrap">
                <div class="dark-level-badge" style="background-image:url('${escapeHtml(TILE_BLACK_URL)}');"><span>${escapeHtml(String(safeLevel))}</span></div>
              </div>
            </div>
            <div class="progress-bottom">
              <div>${escapeHtml(capLabel || "")}</div>
              <div class="bar"><span style="width:${escapeHtml(String(pct))}%"></span></div>
            </div>
          </div>
        </article>
      `;
    }

    function renderAchievementProgressItem(name, stars, value, target, completionInfo) {
      return `
        <article class="progress-item">
          <div class="progress-visual">
            <span class="avatar-fallback" aria-hidden="true">${escapeHtml((name || "").charAt(0))}</span>
          </div>
          <div class="progress-content">
            <div class="progress-top">
              <div class="progress-name">
                <strong>${escapeHtml(name)}</strong>
                <span>Achievement</span>
              </div>
              <div class="level-badge-wrap">
                <div class="dark-level-badge" style="background-image:url('${escapeHtml(TILE_BLACK_URL)}');"><span>${escapeHtml(String(stars))}★</span></div>
              </div>
            </div>
            <div class="progress-bottom">
              <div>${escapeHtml(String(value))}${target ? ` / ${escapeHtml(String(target))}` : ""}</div>
              <p>${escapeHtml(completionInfo || "")}</p>
            </div>
          </div>
        </article>
      `;
    }

    function renderProgressItem(item, tab, pageData) {
      if (!Array.isArray(item)) return "";

      if (item[0] === "a") {
        const [, name, stars, value, target, completionInfo] = item;
        return renderAchievementProgressItem(
          name,
          stars,
          value,
          target,
          completionInfo,
        );
      }

      if (item[0] === "p") {
        const [, name, village, level, maxLevel, capLabel, capValue] = item;
        return renderRegularProgressItem(
          name,
          village,
          level,
          capValue || maxLevel || 1,
          capLabel,
          resolveItemImageUrl(name, tab),
        );
      }

      if (tab.isAchievement) {
        const [name, stars, value, target, completionInfo] = item;
        return renderAchievementProgressItem(
          name,
          stars,
          value,
          target,
          completionInfo,
        );
      }

      const [name, level, currentMax] = item;
      return renderRegularProgressItem(
        name,
        tab.itemLabel,
        level,
        currentMax,
        getCapLabel(tab, pageData),
        resolveItemImageUrl(name, tab),
      );
    }

    function renderEmptyState() {
      return `
        <article class="progress-item">
          <div class="progress-content">
            <div class="progress-name">
              <strong>Nessun elemento disponibile.</strong>
            </div>
          </div>
        </article>
      `;
    }

    function renderTabs(tabs, pageData) {
      const container = document.getElementById("progressTabs");
      if (!container) return;

      const buttons = [];
      const panels = [];

      (tabs || []).forEach((tab, index) => {
        const items = Array.isArray(tab.items) ? tab.items : [];
        buttons.push(`
          <button class="tab-button${index === 0 ? " is-active" : ""}" type="button" data-tab-target="${escapeHtml(tab.id)}">
            ${escapeHtml(tab.label)} (${items.length})
          </button>
        `);

        panels.push(`
          <section class="tab-panel${index === 0 ? " is-active" : ""}" data-tab-panel="${escapeHtml(tab.id)}">
            <div class="section-header">
              <h2>${escapeHtml(tab.title)}</h2>
              <p>${escapeHtml(tab.subtitle || "")}</p>
            </div>
            <div class="progress-grid">
              ${items.length ? items.map((item) => renderProgressItem(item, tab, pageData)).join("") : renderEmptyState()}
            </div>
          </section>
        `);
      });

      container.innerHTML = `<div class="tab-list">${buttons.join("")}</div>${panels.join("")}`;
    }

    function renderPage(data) {
      if (!data) return;

      document.title = data.title || document.title;
      document.documentElement.style.setProperty(
        "--background-image",
        data.bg ? `url("${escapeHtml(data.bg)}")` : "none",
      );

      const playerName = document.getElementById("playerName");
      const playerSubtitle = document.getElementById("playerSubtitle");
      const lastUpdated = document.getElementById("lastUpdated");

      if (playerName) playerName.textContent = data.pn || "";
      if (playerSubtitle) {
        playerSubtitle.textContent = `${data.pt || ""} · ${data.cn || ""}`;
      }
      if (lastUpdated) lastUpdated.textContent = data.lu || "";

      renderProfileVisuals(data.profile);
      renderChips(data);
      renderStats("summaryStats", data.s || [], true);
      renderStats("topStats", data.o || []);
      renderTabs(data.tabs || [], data);
    }

    function showImportError() {
      document.body.innerHTML = `
        <main class="page">
          <section class="card section">
            <div class="section-header">
              <h2>Dati mancanti o non validi</h2>
            </div>
            <p style="color: var(--muted); line-height: 1.6; margin: 0;">
              Questa pagina deve essere aperta dal bot con un parametro <strong>d</strong> o <strong>data</strong> valido.
            </p>
          </section>
        </main>
      `;
    }

    function initTabs() {
      const buttons = Array.from(document.querySelectorAll("[data-tab-target]"));
      const panels = Array.from(document.querySelectorAll("[data-tab-panel]"));

      function activateTab(tabId) {
        buttons.forEach((button) => {
          button.classList.toggle(
            "is-active",
            button.getAttribute("data-tab-target") === tabId,
          );
        });

        panels.forEach((panel) => {
          panel.classList.toggle(
            "is-active",
            panel.getAttribute("data-tab-panel") === tabId,
          );
        });
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          activateTab(button.getAttribute("data-tab-target"));
        });
      });

      if (buttons.length > 0) {
        activateTab(buttons[0].getAttribute("data-tab-target"));
      }
    }

    function initTelegramWebApp() {
      const tg = window.Telegram?.WebApp;

      if (!tg) return;

      tg.ready();
      tg.expand();
    }

    function triggerPdfExport() {
      window.print();
    }

    function initExportControls() {
      const printButton = document.getElementById("printButton");

      if (printButton) {
        printButton.addEventListener("click", triggerPdfExport);
      }

      const tg = window.Telegram?.WebApp;

      if (!tg?.MainButton) return;

      tg.MainButton.setText("Esporta PDF");
      tg.MainButton.show();
      tg.MainButton.onClick(triggerPdfExport);
    }

    const encodedData = getPageDataParam();
    const rawPageData = decodePageData(encodedData);
    const pageData = normalizePageData(rawPageData);

    if (!pageData) {
      showImportError();
      return;
    }

    renderPage(pageData);
    initTabs();
    initTelegramWebApp();
    initExportControls();
  })();
</script>
  </body>
</html>
